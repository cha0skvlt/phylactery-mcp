[package]
name = "phylactery-mcp"
version = "1.0.0"
edition = "2024"
publish = false
description = "Phylactery MCP server: one vector circuit over memories, mind_events, causal_lessons and self_reflections. Companion server for CHA0S AOE."
license-file = "LICENSE"

[[bin]]
name = "phylactery-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
md5 = "0.7"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# `net` and `io-util` are here for the loopback listener in tests/embed_contract.rs: the wire
# contract is checked against a real socket, not a mock.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
